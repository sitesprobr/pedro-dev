<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedro · Desenvolvimento Web</title>
    <meta name="description"
        content="Criação de sites, lojas online, sistemas sob medida, APIs e automações. Do simples ao completo.">
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header class="topo">
        <img class="logo" src="logo.png.png" alt="Pedro · Desenvolvimento Web">
        <p class="sub">Do site simples ao sistema completo</p>
        <span class="selo">✅ Confeitarias, lojas e serviços já no ar</span>
    </header>

    <!-- Serviços (cards clicáveis) -->
    <main class="conteudo">
        <p class="dica">👆 Toque em cada serviço para saber mais</p>
        <div id="servicos" class="servicos"></div>
    </main>

    <!-- Rodapé / CTA -->
    <footer class="rodape">
        <p class="cta">⚡ Entrega rápida · Orçamento sem compromisso</p>
        <p class="cta-forte">📩 Chama no direct!</p>
    </footer>

    <script src="app.js"></script>
</body>

</html>
